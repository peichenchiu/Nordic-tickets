name: Daily Finland/Norway fare check

on:
  schedule:
    # 台灣時間 11:15 開始（GitHub 排程常晚 10～20 分鐘，查詢約 25 分鐘），信件約中午 12:00 寄達。
    # cron 用 UTC：台灣 = UTC+8
    - cron: "15 3 * * *"
    # 備援：GitHub 忙碌時可能略過排程；主排程已跑過或正在跑，備援會直接跳過
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "只查前幾組日期（診斷用，空白=全部）"
        required: false
      test_email:
        description: "只寄一封測試信（不查票）"
        type: boolean
        default: false
      dry_run:
        description: "只查價、不寄信、不記錄歷史（評估用）"
        type: boolean
        default: false
      require_airline:
        description: "評估用：只看有這家航空的行程（英文名稱，例如 China Airlines）；會同時取消託運行李排除"
        required: false
      profile:
        description: "只跑其中一個查詢：economy（經濟艙）或 etihad（阿提哈德商務艙）；空白 = 兩個都跑"
        required: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 兩個查詢同時跑，各自寄一封信、各自記錄歷史最低價
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: economy
            report_name: 芬蘭挪威
            cabin: economy
            only_airline: ""
            via: ""
            history_label: nordic-history
            threshold: "85000"
            require_bags: ""
          - profile: etihad
            report_name: 阿提哈德商務艙
            cabin: business
            only_airline: Etihad
            via: Abu Dhabi
            history_label: nordic-etihad-history
            threshold: "0"  # 先不設門檻：只在創歷史新低或比最近 7 天平均便宜 5% 時推薦
            require_bags: "0"  # 商務艙一定含託運行李
    steps:
      - name: Skip profiles not requested
        id: pick
        if: inputs.profile && inputs.profile != matrix.profile
        run: echo "skip=true" >> "$GITHUB_OUTPUT"
      - name: Skip if another scheduled run already covers this slot
        id: guard
        if: github.event_name == 'schedule' && steps.pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since=$(date -u -d '-100 min' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/nordic.yml/runs?event=schedule&created=>$since" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .id < ${{ github.run_id }}
                   and (.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\"))] | length")
          echo "earlier runs in this slot: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.skip != 'true' && steps.pick.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skip != 'true' && steps.pick.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.skip != 'true' && steps.pick.outputs.skip != 'true'
        run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Check fares
        if: steps.guard.outputs.skip != 'true' && steps.pick.outputs.skip != 'true'
        env:
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUIRE_AIRLINE: ${{ inputs.require_airline }}
          REQUIRE_BAGS: ${{ inputs.require_airline && '0' || matrix.require_bags }}
          REPORT_NAME: ${{ matrix.report_name }}
          CABIN: ${{ matrix.cabin }}
          ONLY_AIRLINE: ${{ matrix.only_airline }}
          VIA: ${{ matrix.via }}
          HISTORY_LABEL: ${{ matrix.history_label }}
          THRESHOLD_TWD: ${{ matrix.threshold }}
          TEST_EMAIL: ${{ inputs.test_email }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SMTP_USER: ${{ inputs.dry_run != true && secrets.SMTP_USER || '' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python check_nordic.py
      - name: Upload results & debug
        if: always() && steps.guard.outputs.skip != 'true' && steps.pick.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nordic-results-${{ matrix.profile }}
          path: |
            results/
            debug/
          retention-days: 14
